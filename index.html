  <title>سبائك الفخامة</title>
  <style>
    :root{--bg:#0e1114;--panel:#171b1f;--line:#2b2f32;--gold:#cfae69;--gold2:#f2d787;--ivory:#f8f1e4;--muted:#aaa196;--ink:#101315}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ivory);font-family:Tahoma,Arial,sans-serif}.shell{width:min(1060px,calc(100% - 32px));margin:auto;padding:20px 0 34px}.brand{height:60px;display:flex;gap:11px;align-items:center;font-weight:800;font-size:20px}.brand svg{width:44px;height:44px}.hero{min-height:280px;display:grid;place-items:center;border:1px solid #1c2023;border-radius:24px;background:radial-gradient(circle at 50% 35%,#24221a 0%,#171b1f 34%,#111417 72%);overflow:hidden}.ounce{border:1px solid rgba(207,174,105,.55);background:rgba(9,11,13,.76);border-radius:20px;padding:27px 30px;display:flex;align-items:baseline;gap:11px;direction:ltr;box-shadow:0 18px 50px rgba(0,0,0,.22)}.ounce-value{font-variant-numeric:tabular-nums;font-weight:800;font-size:clamp(32px,6vw,46px);letter-spacing:.5px}.currency,.ounce-tag{color:var(--gold2);font-weight:800}.currency{font-size:20px}.ounce-tag{font-size:12px;letter-spacing:1.4px}.actions{display:flex;justify-content:center;gap:10px;padding:17px 0}button{font:inherit;border:0;border-radius:12px;padding:13px 21px;cursor:pointer;font-weight:800}.refresh{background:var(--gold);color:var(--ink)}.share{border:1px solid #45423a;background:transparent;color:var(--ivory)}button:active{transform:scale(.98)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{min-height:130px;border:1px solid var(--line);border-radius:18px;padding:17px;background:var(--panel);display:flex;flex-direction:column;justify-content:space-between}.card.featured{background:var(--gold);border-color:#e3c784;color:var(--ink)}.name{font-size:16px;font-weight:800}.price{display:flex;align-items:center;justify-content:flex-end;gap:8px;direction:ltr;font-weight:800;font-size:29px;font-variant-numeric:tabular-nums}.code{font-size:13px;color:#bba97c;font-weight:800}.featured .code{color:#493915}.riyal{width:15px;height:19px;display:block}.designer{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--gold);text-decoration:none;font-size:13px;font-weight:700;padding:26px 0 5px}.designer:hover{text-decoration:underline}.status{height:18px;text-align:center;color:var(--muted);font-size:11px;margin-top:7px}.status.error{color:#dfa69a}@media(max-width:640px){.shell{width:calc(100% - 32px);padding-top:10px}.brand{justify-content:center}.hero{min-height:225px}.cards{grid-template-columns:1fr;gap:10px}.card{min-height:99px}.price{font-size:28px}.ounce{padding:25px 20px;gap:8px}.ounce-value{font-size:37px}}
  </style>
</head>

  </main>
  <script>
    const API='https://api.gold-api.com/price/XAU/USD',CACHE='sabaaek-xau-usd-v1',GRAMS=31.1034768;
    const f=n=>new Intl.NumberFormat('en-US',{minimumFractionDigits:1,maximumFractionDigits:1}).format(n);
    const render=q=>{const p=Number(q.price);document.querySelector('#ounce').textContent=new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(p);[['#k24',.999],['#k21',.875],['#k18',.75]].forEach(([id,purity])=>document.querySelector(id).textContent=f(p/GRAMS*3.75*purity));document.querySelector('#status').textContent=`آخر تحديث: ${new Intl.DateTimeFormat('ar-SA',{hour:'numeric',minute:'2-digit'}).format(new Date(q.updatedAt))}`;document.querySelector('#status').className='status'};
    async function load(force=false){const cached=JSON.parse(localStorage.getItem(CACHE)||'null');if(!force&&cached&&Date.now()-cached.saved<30000){render(cached.data);return}try{const c=new AbortController,set=setTimeout(()=>c.abort(),8000),r=await fetch(API,{signal:c.signal});clearTimeout(set);if(!r.ok)throw Error('request');const q=await r.json();if(q.symbol!=='XAU'||q.currency!=='USD'||!Number.isFinite(Number(q.price)))throw Error('data');localStorage.setItem(CACHE,JSON.stringify({saved:Date.now(),data:q}));render(q)}catch{if(cached){render(cached.data);document.querySelector('#status').textContent='آخر قراءة محفوظة'}else{document.querySelector('#status').textContent='تعذر تحديث السعر الآن';document.querySelector('#status').className='status error'}}}
    document.querySelector('#refresh').addEventListener('click',()=>load(true));document.querySelector('#share').addEventListener('click',async()=>{const t=`سبائك الفخامة\nالأونصة: ${document.querySelector('#ounce').textContent} $ OUNCE\nعيار 21: ${document.querySelector('#k21').textContent} ⃁ 21K`;if(navigator.share)await navigator.share({title:'سبائك الفخامة',text:t});else await navigator.clipboard.writeText(t)});load();
  </script>
